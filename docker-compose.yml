name: shortener

services:
  postgres:
    image: postgres:16.10-alpine
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}   # guard-rail against runaway containers; override in .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: postgres
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in .env (see .env.example)}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env (see .env.example)}
      PROCESSOR_DB_PASSWORD: ${PROCESSOR_DB_PASSWORD:?set PROCESSOR_DB_PASSWORD in .env (see .env.example)}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env (see .env.example)}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/bootstrap:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      # TCP probe: the temporary initdb server listens only on the Unix socket, so it cannot
      # satisfy this check; querying `shortener` also proves bootstrap.sql has run.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d shortener -tAc 'select 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: shortener-api:${GIT_SHA:-dev}
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATOR_DATABASE_URL: postgresql+psycopg://migrator:${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in .env (see .env.example)}@postgres:5432/shortener
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    mem_limit: ${ELASTICMQ_MEM_LIMIT:-256m}   # guard-rail against runaway containers; override in .env
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    # No healthcheck: the native image ships no shell or HTTP client. Consumers retry on connect.

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}   # guard-rail against runaway containers; override in .env
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env (see .env.example)}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env (see .env.example)}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (see .env.example)}
      SHORTENER_ADMIN_CLIENT_SECRET: ${SHORTENER_ADMIN_CLIENT_SECRET:?set SHORTENER_ADMIN_CLIENT_SECRET in .env (see .env.example)}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has bash but no curl; probe the management port's readiness endpoint over /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -Eq '"status" ?: ?"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-seed:
    build:
      context: .
      dockerfile: tools/keycloak-tools/Dockerfile
    image: shortener-keycloak-tools:${GIT_SHA:-dev}
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: shortener
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env (see .env.example)}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (see .env.example)}
      USERS_FILE: /config/users.yaml
      RESET_PASSWORDS: ${RESET_PASSWORDS:-false}
    volumes:
      - ./infra/keycloak/users.yaml:/config/users.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: shortener-api:${GIT_SHA:-dev}
    mem_limit: ${API_MEM_LIMIT:-512m}   # guard-rail against runaway containers; override in .env
    environment:
      DATABASE_URL: postgresql+psycopg://api_user:${API_DB_PASSWORD:?set API_DB_PASSWORD in .env (see .env.example)}@postgres:5432/shortener
      PUBLIC_BASE_URL: http://localhost:8000
      OIDC_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/realms/shortener
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/shortener
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local       # ElasticMQ ignores credentials; boto3 requires some
      AWS_SECRET_ACCESS_KEY: local
      SERVICE_VERSION: ${GIT_SHA:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      DEPLOYMENT_ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      elasticmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  click-processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: shortener-click-processor:${GIT_SHA:-dev}
    mem_limit: ${PROCESSOR_MEM_LIMIT:-512m}   # guard-rail against runaway containers; override in .env
    environment:
      DATABASE_URL: postgresql+psycopg://processor_user:${PROCESSOR_DB_PASSWORD:?set PROCESSOR_DB_PASSWORD in .env (see .env.example)}@postgres:5432/shortener
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local       # ElasticMQ ignores credentials; boto3 requires some
      AWS_SECRET_ACCESS_KEY: local
      SERVICE_VERSION: ${GIT_SHA:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      DEPLOYMENT_ENVIRONMENT: local
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: shortener-admin:${GIT_SHA:-dev}
    mem_limit: ${ADMIN_MEM_LIMIT:-512m}   # guard-rail against runaway containers; override in .env
    environment:
      DATABASE_URL: postgresql+psycopg://admin_user:${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env (see .env.example)}@postgres:5432/shortener
      API_BASE_URL: http://api:8000
      PUBLIC_BASE_URL: http://localhost:8001
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/shortener
      OIDC_CLIENT_ID: shortener-admin
      OIDC_CLIENT_SECRET: ${SHORTENER_ADMIN_CLIENT_SECRET:?set SHORTENER_ADMIN_CLIENT_SECRET in .env (see .env.example)}
      COOKIE_SECRET: ${ADMIN_COOKIE_SECRET:?set ADMIN_COOKIE_SECRET in .env (see .env.example)}
      COOKIE_SECURE: "false"   # local http only; true behind TLS
      SERVICE_VERSION: ${GIT_SHA:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      DEPLOYMENT_ENVIRONMENT: local
      OBSERVABILITY_URL: http://localhost:3000/d/shortener-overview   # browser-facing; admin-only nav link
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    mem_limit: ${OTEL_LGTM_MEM_LIMIT:-2g}   # guard-rail against runaway containers; override in .env
    ports:
      - "3000:3000"   # Grafana (anonymous admin in this image; local only)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - lgtm-data:/data
      - ./infra/otel/dashboards:/otel-lgtm/shortener-dashboards:ro
      - ./infra/otel/grafana/shortener-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shortener.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health && curl -s -o /dev/null http://localhost:4318/v1/traces"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  lgtm-data:
