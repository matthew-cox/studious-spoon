[project]
name = "shortener-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "shortener-events",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",  # instrumentation-sqlalchemy 0.66b0 supports <2.1
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "boto3>=1.35",
  "shortener-observability",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-instrumentation-sqlalchemy==0.66b0",
  "opentelemetry-instrumentation-httpx==0.66b0",
  "opentelemetry-instrumentation-botocore==0.66b0",
]


[tool.uv.sources]
shortener-events = { workspace = true }
shortener-observability = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortener_api"]
