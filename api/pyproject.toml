[project]
name = "shortener-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "shortener-events",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
shortener-events = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortener_api"]
