[project]
name = "platform-url-shortener"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/shortener-events"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "boto3-stubs[sqs]>=1.35",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]
extend-include = ["scripts/*"]
src = ["libs/shortener-events/src", "api/src", "tools/keycloak-tools/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"**/alembic/versions/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not e2e'"
asyncio_mode = "auto"
testpaths = ["libs", "api", "tools", "tests"]
markers = [
  "integration: needs a Docker daemon (testcontainers)",
  "e2e: needs the full compose stack running (make up)",
]

[tool.coverage.run]
branch = true
source = ["shortener_events", "shortener_api", "keycloak_tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
