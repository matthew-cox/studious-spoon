name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv python install 3.12
      - run: make sync
      - run: make lint
      - run: make typecheck
      - run: make test # integration tests use the runner's Docker daemon via testcontainers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv python install 3.12
      - run: make sync
      - run: cp .env.example .env
      - run: make up
      - run: make e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dockerfile:
          - api/Dockerfile
          - processor/Dockerfile
          - tools/keycloak-tools/Dockerfile
          - admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.dockerfile }} --build-arg GIT_SHA=${{ github.sha }} .
