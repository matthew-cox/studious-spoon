{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<article>
  <h1>{{ title }}</h1>
  {% if message %}<p>{{ message }}</p>{% endif %}
  <a href="/">Back to the dashboard</a>
  {% if trace_id %}<p class="muted"><small>Reference: <code>{{ trace_id }}</code></small></p>{% endif %}
</article>
{% endblock %}
